services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rocky_mountain_ruby
      POSTGRES_PASSWORD: rocky_mountain_ruby
      POSTGRES_DB: rocky_mountain_ruby_2026_demo_2_development
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  temporal-postgresql:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    volumes:
      - temporal_postgres_data:/var/lib/postgresql/data

  temporal:
    image: temporalio/auto-setup:latest
    depends_on:
      - temporal-postgresql
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: temporal-postgresql
    ports:
      - "7233:7233"

  temporal-ui:
    image: temporalio/ui:latest
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"

  # DBOS Conductor -- the DBOS equivalent of the Temporal UI above, for the
  # python-worker/ demo. Off by default (needs a free license key you get
  # yourself -- see README); start explicitly with:
  #   docker compose --profile conductor up -d
  conductor:
    image: dbosdev/conductor:latest
    profiles: ["conductor"]
    depends_on:
      - postgres
    environment:
      DBOS_CONDUCTOR_LICENSE_KEY: ${DBOS_CONDUCTOR_LICENSE_KEY:-}
      DBOS__CONDUCTOR_DB_URL: postgresql://rocky_mountain_ruby:rocky_mountain_ruby@postgres:5432/dbos_conductor?sslmode=disable
    ports:
      - "8090:8090"

  conductor-console:
    image: dbosdev/console:latest
    profiles: ["conductor"]
    depends_on:
      - conductor
    environment:
      DBOS_CONDUCTOR_URL: conductor:8090
    ports:
      - "8081:8080"

volumes:
  postgres_data:
  temporal_postgres_data:
